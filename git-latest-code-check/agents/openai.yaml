interface:
  display_name: "Git Safe Collaboration"
  short_description: "Guard Git targets, provenance, integration and pushes"
  default_prompt: "Use $git-latest-code-check to coordinate this Git task safely: preserve business intent, distinguish development and integration targets, retain commit provenance, load only the matching workflow, and visibly report results without expanding authorization."

policy:
  allow_implicit_invocation: false
